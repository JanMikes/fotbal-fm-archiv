# Release: build+push this app's image, then trigger its deploy.
#
# This app's deploy.sh + compose live in TheDevs-cz/lily.srv (apps/fotbal-fm-archiv).
# This workflow does NOT deploy directly (no more SSH): it only builds+pushes the
# ghcr image and then triggers the deploy via the shared reusable workflow, which
# HMAC-POSTs https://deploy.lily.srv.thedevs.cz/hooks/fotbal-fm-archiv.
#
# Requires GH secret DEPLOY_WEBHOOK_SECRET (per-app HMAC key; set via `gh secret set`).
# It is passed EXPLICITLY (NOT `secrets: inherit`) because the shared workflow lives
# under a DIFFERENT owner (TheDevs-cz) and inherit does not cross owners. GITHUB_TOKEN
# is provided to the called workflow automatically.

name: Release

# push to main ONLY — public repo, so never pull_request_target / untrusted PR code.
on:
    push:
        branches:
            - main

permissions:
    contents: read
    packages: write

jobs:
    ship:
        uses: TheDevs-cz/ci/.github/workflows/_ship.yml@v1
        secrets:
            DEPLOY_WEBHOOK_SECRET: ${{ secrets.DEPLOY_WEBHOOK_SECRET }}
        with:
            app: fotbal-fm-archiv
            image: ghcr.io/janmikes/fotbal-fm-archiv
            deploy_host: lily.srv.thedevs.cz
